<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <title>Pokédex</title>
</head>
<body>
    <div>
      <main>
        <img src="#" alt="pokemon" class="pokemon_imagem">
            <h1 class="pokemon_dados">
                  <span class="pokemon_numero"></span>—
                  <span class="pokemon_nome"></span>
            </h1> 
            <form class="form">
                  <input type="search" class="input_pesquisa" placeholder="Nome ou número do pokémon..." required>
            </form>
            <div class="buttons">
                  <button class="button btn-prev">Anterior <=</button>
                  <button class="button btn-next">Próximo =></button>
            </div>
            
        <img src="https://pokedex-kappa-sooty.vercel.app/images/pokedex.png" alt="pokédex png" class="pokedex">
      </main>
    </div>
</body>

<script src="scripts.js"></script>
</html>
